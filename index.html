<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solutions Info-Tech</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <!-- Icônes Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<!-- Preloader -->
<div id="preloader">
  <div class="loader">
    <!-- Logo animé -->
    <img src="assets/images/logom.jpeg" alt="Logo" class="logo-animated">

    <!-- Titre entreprise -->
  <div class="brand-title">
    <span class="solutions">SOLUTIONS</span>
    <span class="separator">—</span>
    <span class="info-tech">INFO-TECH</span>
    <span class="separator">—</span>
  </div>

    <!-- Boule rebondissante -->
    <div class="ball"></div>

    <!-- Smiley qui saute -->
    <div class="runner">
      <i class="fas fa-running"></i>
    </div>

    <p class="loading-text">✨ Préparation de votre expérience digitale...</p>
  </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
  setTimeout(function(){
      // Redirection vers indexa.html
      window.location.href = "indexa.html";
    }, 4000); // 4 secondes
});
</script>
</body>
</html>
